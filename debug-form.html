<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Form Submission</title>
</head>
<body>
    <h1>Debug Form Submission</h1>
    
    <form id="property-form">
        <div>
            <label for="property-title">Title:</label>
            <input type="text" id="property-title" value="Test Property" required>
        </div>
        <div>
            <label for="property-description">Description:</label>
            <textarea id="property-description" required>Test Description</textarea>
        </div>
        <div>
            <label for="property-location">Location:</label>
            <input type="text" id="property-location" value="Test Location" required>
        </div>
        <div>
            <label for="property-terrain">Terrain:</label>
            <select id="property-terrain" required>
                <option value="flat" selected>Flat</option>
                <option value="hilly">Hilly</option>
            </select>
        </div>
        <div>
            <label for="property-price">Price:</label>
            <input type="number" id="property-price" value="100000" required>
        </div>
        <div>
            <label for="property-size">Size:</label>
            <input type="number" id="property-size" value="1000" required>
        </div>
        <button type="submit">Submit Property</button>
    </form>
    
    <div id="result"></div>
    
    <script src="js/main.js"></script>
    <script>
        // Add some test user data to localStorage for testing
        const testUser = {
            id: 'test-user-id',
            name: 'Test User',
            email: 'test@example.com',
            role: 'seller',
            token: 'simulated-token-test-user-' + Date.now()
        };
        localStorage.setItem('currentUser', JSON.stringify(testUser));
        
        // Listen for form submission
        document.getElementById('property-form').addEventListener('submit', function(e) {
            console.log('Form submit event triggered');
            document.getElementById('result').innerHTML = '<p>Form submission detected. Check browser console for details.</p>';
        });
    </script>
</body>
</html>
