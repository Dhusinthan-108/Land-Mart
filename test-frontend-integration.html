<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Property Submission</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
            border: 1px solid #d6e9c6;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
            border: 1px solid #ebccd1;
        }
    </style>
</head>
<body>
    <h1>Test Property Submission</h1>
    
    <form id="property-form">
        <div class="form-group">
            <label for="property-title">Property Title *</label>
            <input type="text" id="property-title" required>
        </div>
        
        <div class="form-group">
            <label for="property-description">Description *</label>
            <textarea id="property-description" rows="4" required></textarea>
        </div>
        
        <div class="form-group">
            <label for="property-location">Location *</label>
            <input type="text" id="property-location" required>
        </div>
        
        <div class="form-group">
            <label for="property-terrain">Terrain Type *</label>
            <select id="property-terrain" required>
                <option value="">Select Terrain Type</option>
                <option value="flat">Flat</option>
                <option value="hilly">Hilly</option>
                <option value="mountainous">Mountainous</option>
                <option value="waterfront">Waterfront</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="property-price">Price (₹) *</label>
            <input type="number" id="property-price" required>
        </div>
        
        <div class="form-group">
            <label for="property-size">Size (sq.ft) *</label>
            <input type="number" id="property-size" required>
        </div>
        
        <button type="button" onclick="submitProperty()">Submit Property</button>
    </form>
    
    <div id="result" class="result" style="display: none;"></div>

    <script>
        // Utility function to get API base URL (same as in main.js)
        function getApiBaseUrl() {
            return 'http://localhost:5501';
        }

        // Property submission function (similar to the one in add-property.html)
        async function submitProperty() {
            try {
                // For testing purposes, we'll use a sample user ID
                // In a real scenario, this would come from localStorage after login
                const currentUser = {
                    id: '693fac63f5a66f6eec0683e6', // Sample user ID
                    name: 'Test User',
                    email: 'test@example.com'
                };

                // Get form values
                const title = document.getElementById('property-title').value;
                const description = document.getElementById('property-description').value;
                const location = document.getElementById('property-location').value;
                const terrain = document.getElementById('property-terrain').value;
                const price = parseFloat(document.getElementById('property-price').value);
                const size = parseFloat(document.getElementById('property-size').value);
                
                // Validation
                if (!title || !description || !location || !terrain || !price || !size) {
                    showMessage('Please fill in all required fields.', 'error');
                    return;
                }
                
                // Prepare data for API
                const propertyData = {
                    title: title,
                    description: description,
                    location: location,
                    terrain: terrain,
                    price: price,
                    size: size,
                    ownerId: currentUser.id
                };
                
                // Determine the correct API base URL
                const apiBaseUrl = getApiBaseUrl();
                const apiUrl = `${apiBaseUrl}/api/properties`;
                
                console.log('Submitting property to:', apiUrl);
                console.log('Property data:', propertyData);
                
                // Send property data to backend
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(propertyData)
                });
                
                console.log('Property submission response status:', response.status);
                
                let result;
                const contentType = response.headers.get('content-type');
                
                // Check if response has JSON content
                if (contentType && contentType.includes('application/json')) {
                    result = await response.json();
                } else {
                    // If not JSON, try to get text content
                    const text = await response.text();
                    result = { message: text || 'Property submission completed' };
                }
                
                if (response.ok) {
                    showMessage('Property listed successfully!', 'success');
                    // Reset form
                    document.getElementById('property-form').reset();
                } else {
                    showMessage('Property submission failed: ' + (result.message || 'Unknown error'), 'error');
                }
            } catch (error) {
                console.error('Property submission error:', error);
                showMessage('An error occurred during property submission. Please try again.', 'error');
            }
        }
        
        // Helper function to display messages
        function showMessage(text, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = text;
            resultDiv.className = 'result ' + type;
            resultDiv.style.display = 'block';
            
            // Hide message after 5 seconds
            setTimeout(() => {
                resultDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
