<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Connection Integrity Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .pending { background-color: #fff3cd; border: 1px solid #ffeaa7; color: #856404; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>API Connection Integrity Test</h1>
    
    <div>
        <button onclick="testBasicConnection()">Test Basic Connection</button>
        <button onclick="testUsersAPI()">Test Users API</button>
        <button onclick="testPropertiesAPI()">Test Properties API</button>
        <button onclick="testLoginAndMessages()">Test Login + Messages API</button>
        <button onclick="runAllTests()">Run All Tests</button>
    </div>

    <div id="results"></div>

    <script>
        const baseUrl = 'http://localhost:5503';
        const resultsDiv = document.getElementById('results');

        function addResult(message, isSuccess = true, data = null) {
            const div = document.createElement('div');
            div.className = `test-result ${isSuccess ? 'success' : 'error'}`;
            
            let content = `<strong>${message}</strong>`;
            if (data) {
                content += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
            
            div.innerHTML = content;
            resultsDiv.appendChild(div);
        }

        async function testBasicConnection() {
            try {
                resultsDiv.innerHTML = '<div class="test-result pending">Testing basic server connection...</div>';
                
                const response = await fetch(`${baseUrl}/test-get`);
                const data = await response.json();
                
                if (response.ok) {
                    addResult('✓ Basic server connection successful', true, data);
                } else {
                    addResult('✗ Basic server connection failed', false, data);
                }
            } catch (error) {
                addResult(`✗ Basic server connection error: ${error.message}`, false);
            }
        }

        async function testUsersAPI() {
            try {
                resultsDiv.innerHTML = '<div class="test-result pending">Testing users API...</div>';
                
                const response = await fetch(`${baseUrl}/api/users`);
                const data = await response.json();
                
                if (response.ok && Array.isArray(data)) {
                    addResult(`✓ Users API successful (${data.length} users found)`, true, data.slice(0, 2));
                } else {
                    addResult('✗ Users API failed', false, data);
                }
            } catch (error) {
                addResult(`✗ Users API error: ${error.message}`, false);
            }
        }

        async function testPropertiesAPI() {
            try {
                resultsDiv.innerHTML = '<div class="test-result pending">Testing properties API...</div>';
                
                const response = await fetch(`${baseUrl}/api/properties`);
                const data = await response.json();
                
                if (response.ok && Array.isArray(data)) {
                    addResult(`✓ Properties API successful (${data.length} properties found)`, true, data.slice(0, 1));
                } else {
                    addResult('✗ Properties API failed', false, data);
                }
            } catch (error) {
                addResult(`✗ Properties API error: ${error.message}`, false);
            }
        }

        async function testLoginAndMessages() {
            try {
                resultsDiv.innerHTML = '<div class="test-result pending">Testing login and messages API...</div>';
                
                // Test login
                const loginResponse = await fetch(`${baseUrl}/api/users/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'pradeepa@gmail.com',
                        password: 'pradhu@2005'
                    })
                });
                
                const loginData = await loginResponse.json();
                
                if (!loginResponse.ok) {
                    addResult('✗ Login failed', false, loginData);
                    return;
                }
                
                addResult('✓ Login successful', true, { userId: loginData.user.id });
                
                // Test messages API with authentication
                const userId = loginData.user.id;
                const messagesResponse = await fetch(`${baseUrl}/api/messages/conversation/${userId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer fake-token`,
                        'user-id': userId
                    }
                });
                
                if (messagesResponse.status === 401) {
                    addResult('✓ Messages API authentication working (rejected invalid token as expected)', true);
                } else {
                    addResult('✗ Messages API authentication issue', false, await messagesResponse.text());
                }
                
            } catch (error) {
                addResult(`✗ Login + Messages test error: ${error.message}`, false);
            }
        }

        async function runAllTests() {
            resultsDiv.innerHTML = '';
            await testBasicConnection();
            await testUsersAPI();
            await testPropertiesAPI();
            await testLoginAndMessages();
            
            addResult('All tests completed!', true);
        }
    </script>
</body>
</html>
