<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Integration Test - Land Mart</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            padding: 40px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            min-height: 100vh;
        }

        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .test-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .test-header h1 {
            color: #6366f1;
            margin-bottom: 10px;
        }

        .status {
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            font-weight: 600;
        }

        .status.success {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #10b981;
        }

        .status.error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #ef4444;
        }

        .status.loading {
            background: #dbeafe;
            color: #1e40af;
            border: 2px solid #3b82f6;
        }

        .test-results {
            margin-top: 30px;
        }

        .endpoint {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 4px solid #6366f1;
        }

        .endpoint-name {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .endpoint-url {
            font-family: 'Courier New', monospace;
            color: #6b7280;
            font-size: 14px;
        }

        .data-preview {
            background: #1f2937;
            color: #10b981;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }

        button {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin: 5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
    </style>
</head>

<body>
    <div class="test-container">
        <div class="test-header">
            <h1>🔌 API Integration Test</h1>
            <p>Testing frontend-backend connection on <strong>localhost:5503</strong></p>
        </div>

        <div id="status" class="status loading">
            ⏳ Initializing test...
        </div>

        <div class="test-grid">
            <button onclick="testProperties()">📦 Test Properties</button>
            <button onclick="testApiHealth()">💚 Test API Health</button>
            <button onclick="testAllEndpoints()">🚀 Test All Endpoints</button>
        </div>

        <div class="test-results" id="results"></div>
    </div>

    <script src="js/api-config.js"></script>
    <script>
        const statusDiv = document.getElementById('status');
        const resultsDiv = document.getElementById('results');

        function updateStatus(message, type = 'loading') {
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = message;
        }

        async function testApiHealth() {
            updateStatus('🔍 Testing API connectivity...', 'loading');
            resultsDiv.innerHTML = '';

            try {
                const response = await fetch(`${API_CONFIG.BASE_URL}/test-get`);
                const data = await response.json();

                updateStatus('✅ API is accessible and responding!', 'success');
                resultsDiv.innerHTML = `
                    <div class="endpoint">
                        <div class="endpoint-name">Test Endpoint</div>
                        <div class="endpoint-url">GET ${API_CONFIG.BASE_URL}/test-get</div>
                        <div class="data-preview">${JSON.stringify(data, null, 2)}</div>
                    </div>
                `;
            } catch (error) {
                updateStatus(`❌ API Test Failed: ${error.message}`, 'error');
            }
        }

        async function testProperties() {
            updateStatus('🏘️ Fetching properties from backend...', 'loading');
            resultsDiv.innerHTML = '';

            try {
                const url = `${API_CONFIG.BASE_URL}${API_CONFIG.ENDPOINTS.GET_PROPERTIES}`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const properties = await response.json();

                updateStatus(`✅ Successfully fetched ${properties.length} properties!`, 'success');

                resultsDiv.innerHTML = `
                    <div class="endpoint">
                        <div class="endpoint-name">Properties Endpoint</div>
                        <div class="endpoint-url">GET ${url}</div>
                        <div class="data-preview">${JSON.stringify(properties.slice(0, 3), null, 2)}
... and ${properties.length - 3} more properties</div>
                    </div>
                `;
            } catch (error) {
                updateStatus(`❌ Properties Test Failed: ${error.message}`, 'error');
            }
        }

        async function testAllEndpoints() {
            updateStatus('🚀 Testing all API endpoints...', 'loading');
            resultsDiv.innerHTML = '';

            const endpoints = [
                { name: 'Health Check', url: '/test-get', method: 'GET' },
                { name: 'Properties List', url: API_CONFIG.ENDPOINTS.GET_PROPERTIES, method: 'GET' },
                { name: 'API Test', url: '/api/test', method: 'POST' }
            ];

            let html = '';
            let successCount = 0;

            for (const endpoint of endpoints) {
                try {
                    const url = `${API_CONFIG.BASE_URL}${endpoint.url}`;
                    const options = { method: endpoint.method };

                    if (endpoint.method === 'POST') {
                        options.headers = { 'Content-Type': 'application/json' };
                        options.body = JSON.stringify({ test: true });
                    }

                    const response = await fetch(url, options);
                    const data = await response.json();

                    successCount++;
                    html += `
                        <div class="endpoint">
                            <div class="endpoint-name">✅ ${endpoint.name}</div>
                            <div class="endpoint-url">${endpoint.method} ${url}</div>
                            <div class="data-preview">${JSON.stringify(data, null, 2).substring(0, 200)}...</div>
                        </div>
                    `;
                } catch (error) {
                    html += `
                        <div class="endpoint">
                            <div class="endpoint-name">❌ ${endpoint.name}</div>
                            <div class="endpoint-url">${endpoint.method} ${endpoint.url}</div>
                            <div class="data-preview" style="color: #ef4444;">Error: ${error.message}</div>
                        </div>
                    `;
                }
            }

            updateStatus(`🎉 Test complete! ${successCount}/${endpoints.length} endpoints working`,
                successCount === endpoints.length ? 'success' : 'error');
            resultsDiv.innerHTML = html;
        }

        // Auto-run health check on load
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                testApiHealth();
            }, 500);
        });
    </script>
</body>

</html>
