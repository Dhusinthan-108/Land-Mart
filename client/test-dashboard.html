<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Dashboard Integration</title>
    <link rel="stylesheet" href="styles/main.css">
    <style>
        .test-results {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        .test-result {
            padding: 1rem;
            margin: 1rem 0;
            border-radius: 5px;
        }
        .test-result.pass {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .test-result.fail {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        .test-result.pending {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }
        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin: 0.5rem;
        }
        button:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Land Mart</div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="unified-dashboard.html">Dashboard</a></li>
                <li><a href="test-dashboard.html" class="active">Test Dashboard</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="test-results">
            <h1>Unified Dashboard Integration Test</h1>
            <p>Click the button below to run integration tests:</p>
            
            <button id="run-tests">Run Integration Tests</button>
            
            <div id="test-output">
                <div class="test-result pending">
                    <h3>Tests Pending</h3>
                    <p>Click "Run Integration Tests" to begin testing</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Land Mart. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('run-tests').addEventListener('click', runIntegrationTests);
        
        async function runIntegrationTests() {
            const output = document.getElementById('test-output');
            output.innerHTML = '<h2>Running Integration Tests...</h2>';
            
            // Test 1: API Base URL
            const test1 = document.createElement('div');
            test1.className = 'test-result pending';
            test1.innerHTML = '<h3>Test 1: API Base URL Configuration</h3><p>Checking...</p>';
            output.appendChild(test1);
            
            // Simulate API base URL check
            const apiBaseUrl = 'http://localhost:5501';
            await new Promise(resolve => setTimeout(resolve, 500));
            
            test1.className = 'test-result pass';
            test1.innerHTML = `<h3>Test 1: API Base URL Configuration</h3>
                              <p>✅ PASS: API Base URL is correctly configured as ${apiBaseUrl}</p>`;
            
            // Test 2: CSS Loading
            const test2 = document.createElement('div');
            test2.className = 'test-result pending';
            test2.innerHTML = '<h3>Test 2: CSS Loading</h3><p>Checking...</p>';
            output.appendChild(test2);
            
            // Check if CSS is loaded
            const cssLoaded = document.querySelector('link[href*="main.css"]') !== null;
            await new Promise(resolve => setTimeout(resolve, 500));
            
            if (cssLoaded) {
                test2.className = 'test-result pass';
                test2.innerHTML = '<h3>Test 2: CSS Loading</h3><p>✅ PASS: CSS file is properly loaded</p>';
            } else {
                test2.className = 'test-result fail';
                test2.innerHTML = '<h3>Test 2: CSS Loading</h3><p>❌ FAIL: CSS file not found</p>';
            }
            
            // Test 3: DOM Elements
            const test3 = document.createElement('div');
            test3.className = 'test-result pending';
            test3.innerHTML = '<h3>Test 3: Essential DOM Elements</h3><p>Checking...</p>';
            output.appendChild(test3);
            
            // Check essential elements
            const essentialElements = [
                'header',
                'nav',
                'main',
                'footer'
            ];
            
            let elementsFound = 0;
            essentialElements.forEach(selector => {
                if (document.querySelector(selector)) {
                    elementsFound++;
                }
            });
            
            await new Promise(resolve => setTimeout(resolve, 500));
            
            if (elementsFound === essentialElements.length) {
                test3.className = 'test-result pass';
                test3.innerHTML = `<h3>Test 3: Essential DOM Elements</h3>
                                  <p>✅ PASS: All ${elementsFound}/${essentialElements.length} essential elements found</p>`;
            } else {
                test3.className = 'test-result fail';
                test3.innerHTML = `<h3>Test 3: Essential DOM Elements</h3>
                                  <p>❌ FAIL: Only ${elementsFound}/${essentialElements.length} essential elements found</p>`;
            }
            
            // Test 4: API Connectivity
            const test4 = document.createElement('div');
            test4.className = 'test-result pending';
            test4.innerHTML = '<h3>Test 4: API Connectivity</h3><p>Checking...</p>';
            output.appendChild(test4);
            
            try {
                // Test properties API
                const response = await fetch(`${apiBaseUrl}/api/properties`);
                const isConnected = response.ok;
                
                if (isConnected) {
                    test4.className = 'test-result pass';
                    test4.innerHTML = '<h3>Test 4: API Connectivity</h3><p>✅ PASS: Successfully connected to backend API</p>';
                } else {
                    test4.className = 'test-result fail';
                    test4.innerHTML = `<h3>Test 4: API Connectivity</h3>
                                      <p>❌ FAIL: API responded with status ${response.status}</p>`;
                }
            } catch (error) {
                test4.className = 'test-result fail';
                test4.innerHTML = `<h3>Test 4: API Connectivity</h3>
                                  <p>❌ FAIL: Connection error - ${error.message}</p>`;
            }
            
            // Summary
            const summary = document.createElement('div');
            summary.className = 'test-result';
            summary.innerHTML = '<h3>Test Summary</h3><p>Integration tests completed. Check results above.</p>';
            output.appendChild(summary);
        }
    </script>
</body>
</html>
